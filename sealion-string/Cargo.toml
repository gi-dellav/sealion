[package]
name = "sealion-string"
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
description = "Sealion's ECMAScript string implementation."
keywords = ["javascript", "js", "string"]
categories = ["parser-implementations", "compilers"]
readme = "../README.md"
license = "Unlicense OR MIT"
repository = "https://github.com/gi-dellav/sealion.git"

[dependencies]
itoa = "1.0.19"
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
ryu-js = "1.0.3"

static_assertions = "1.1.0"
pastey = "0.2.3"
fast-float2 = "0.2.4"

[package.metadata.docs.rs]
all-features = true
