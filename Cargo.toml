[workspace]
members = ["sealion-engine", "sealion-string", "sealionjs"]
default-members = ["sealionjs"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
cranelift-codegen = { version = "0.132.3", features = ["x86", "arm64"] }
cranelift-frontend = "0.132.3"
cranelift-module = "0.132.3"
cranelift-object = "0.132.3"
target-lexicon = "0.13.3"
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
oxc_semantic = "0.159.0"
oxc_transformer = "0.159.0"
object = { version = "0.39", default-features = false, features = ["read_core", "write_core", "elf", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
postcard = "1.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
itoa = "1.0.19"
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
ryu-js = "1.0.3"
static_assertions = "1.1.0"
pastey = "0.2.3"
fast-float2 = "0.2.4"

sealion-engine = { path = "sealion-engine" }
sealion-string = { path = "sealion-string" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
