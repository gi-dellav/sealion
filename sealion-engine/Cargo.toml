[package]
name = "sealion-engine"
version = "0.7.0"
edition = "2024"
rust-version = "1.98"

[features]
default = []
jit = ["dep:object", "dep:libc", "dep:postcard", "dep:serde", "dep:sealion-string"]

[dependencies]
cranelift-codegen = { version = "0.132.3", features = ["x86", "arm64"] }
cranelift-frontend = "0.132.3"
cranelift-module = "0.132.3"
cranelift-object = "0.132.3"
target-lexicon = "0.13.3"
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
oxc_transformer = "0.159.0"
oxc_semantic = "0.159.0"
object = { version = "0.39", optional = true, default-features = false, features = ["read_core", "write_core", "elf", "std"] }
libc = { version = "0.2", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
postcard = { version = "1.1", optional = true }
sealion-string = { path = "../sealion-string", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
