[package]
name = "sealionjs"
version = "0.7.0"
edition = "2024"
rust-version = "1.98"

[features]
default = ["jit"]
jit = ["sealion-engine/jit"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sealion-engine = { path = "../sealion-engine" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
